<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" rx="24" fill="#092325"/><g font-family="Arial,sans-serif"><text x="70" y="80" fill="#effffb" font-size="36" font-weight="700">需求收斂閘門：從模糊描述到可執行變更</text><text x="70" y="120" fill="#9fc4ba" font-size="18">ChatGPT 拆解與追問 → 團隊確認政策 → Codex 在明確邊界內落地</text><g fill="#123337" stroke-width="3"><rect x="60" y="205" width="220" height="250" rx="20" stroke="#6aa7a1"/><rect x="350" y="175" width="250" height="310" rx="20" fill="#10443c" stroke="#64d8b6"/><rect x="675" y="205" width="220" height="250" rx="20" fill="#302942" stroke="#ad9be5"/><rect x="970" y="205" width="170" height="250" rx="20" fill="#173f35" stroke="#7be0b4"/></g><g fill="#fff" font-size="24" font-weight="700" text-anchor="middle"><text x="170" y="258">模糊需求</text><text x="475" y="228">ChatGPT 拆解</text><text x="785" y="258">團隊確認</text><text x="1055" y="258">Codex 落地</text></g><g fill="#c3ded7" font-size="17" text-anchor="middle"><text x="170" y="310">「做一個匯出功能」</text><text x="170" y="355" fill="#f29b9b">角色、範圍、例外不明</text><text x="475" y="285">✓ 假設清單</text><text x="475" y="325">✓ 風險與追問</text><text x="475" y="365">✓ 方案比較</text><text x="475" y="405">✓ Given / When / Then</text><text x="785" y="310">權限政策</text><text x="785" y="350">資料邊界</text><text x="785" y="390">非功能需求與非目標</text><text x="1055" y="310">修改程式碼</text><text x="1055" y="350">新增測試</text><text x="1055" y="390">回報證據與風險</text></g><g stroke="#64d8b6" stroke-width="4"><path d="M280 335H340"/><path d="M600 335H665"/><path d="M895 335H960"/></g><rect x="245" y="535" width="710" height="78" rx="18" fill="#0d2d2e" stroke="#39746c"/><text x="600" y="566" text-anchor="middle" fill="#effffb" font-size="20" font-weight="700">閘門規則</text><text x="600" y="596" text-anchor="middle" fill="#accbc4" font-size="16">未確認的 OPEN 項目不得進入實作；每個驗收條件都要有測試或可重現證據</text></g></svg>