<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" rx="24" fill="#092325"/><g font-family="Arial,sans-serif"><text x="70" y="80" fill="#effffb" font-size="36" font-weight="700">一份可驗收規格的五個層次</text><text x="70" y="120" fill="#9fc4ba" font-size="18">不只描述成功路徑，也要定義權限、邊界、失敗與證據</text><g stroke-width="2"><rect x="65" y="180" width="195" height="285" rx="18" fill="#12383e" stroke="#59c7d8"/><rect x="285" y="180" width="195" height="285" rx="18" fill="#123c32" stroke="#64d8b6"/><rect x="505" y="180" width="195" height="285" rx="18" fill="#302943" stroke="#a99be0"/><rect x="725" y="180" width="195" height="285" rx="18" fill="#40311d" stroke="#e8ad62"/><rect x="945" y="180" width="195" height="285" rx="18" fill="#432431" stroke="#ef789b"/></g><g fill="#fff" font-size="22" font-weight="700" text-anchor="middle"><text x="162" y="240">1｜角色與權限</text><text x="382" y="240">2｜輸入與邊界</text><text x="602" y="240">3｜結果與狀態</text><text x="822" y="240">4｜失敗與重送</text><text x="1042" y="240">5｜證據與治理</text></g><g fill="#d1e4df" font-size="16" text-anchor="middle"><text x="162" y="305">誰可以執行？</text><text x="162" y="345">是否租戶隔離？</text><text x="162" y="385">拒絕回傳什麼？</text><text x="382" y="305">格式與欄位</text><text x="382" y="345">大小與日期範圍</text><text x="382" y="385">不合法如何處理</text><text x="602" y="305">同步或非同步</text><text x="602" y="345">狀態碼與 job_id</text><text x="602" y="385">完成條件</text><text x="822" y="305">冪等與重複點擊</text><text x="822" y="345">重試與取消</text><text x="822" y="385">錯誤是否可觀測</text><text x="1042" y="305">測試對應驗收</text><text x="1042" y="345">稽核與個資</text><text x="1042" y="385">決策與風險紀錄</text></g><rect x="165" y="525" width="870" height="82" rx="20" fill="#0d2d2e" stroke="#39746c"/><text x="600" y="558" text-anchor="middle" fill="#effffb" font-size="20" font-weight="700">判斷標準</text><text x="600" y="588" text-anchor="middle" fill="#accbc4" font-size="16">只要其中一層仍依賴猜測，就還不是可以安心交給 Codex 的規格</text></g></svg>